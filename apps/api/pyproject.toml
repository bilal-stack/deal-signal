[project]
name = "dealsignal"
version = "0.1.0"
description = "Deal-sourcing tool: finds, cleans and scores small businesses worth acquiring."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "geoalchemy2>=0.16",
    "pgvector>=0.3",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "trafilatura>=1.12",
    "protego>=0.3",
    "tldextract>=5.1",
    "phonenumbers>=8.13",
    "rapidfuzz>=3.10",
    "anthropic>=1.6",
    "httpx2>=2.13",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dealsignal = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Autogenerated by Alembic: column definitions are long by nature.
"alembic/versions/*" = ["E501"]
# DuckDB has no bind parameters for a remote parquet path. Every value in this
# query is an internal constant, and category slugs are pattern-checked first.
"src/dealsignal/sources/overture.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "geoalchemy2.*",
    "trafilatura.*",
    "selectolax.*",
    "protego.*",
    "arq.*",
    "duckdb.*",
    "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs a real Postgres; skipped with a reason when none is reachable",
]
