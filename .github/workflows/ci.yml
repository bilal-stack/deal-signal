name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy src

      # The integration tests need Postgres with PostGIS, pgvector and pg_trgm. The
      # project's own database image provides exactly that, so CI uses it too.
      - name: Start the database
        working-directory: .
        run: |
          docker compose up -d --wait db

      - name: Tests (unit and integration)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://dealsignal:dealsignal@localhost:5433/dealsignal_test
        run: |
          pytest --cov=dealsignal --cov-report=term-missing -rs
          # Integration tests skip when Postgres is unreachable. In CI that would hide
          # a broken setup, so a skip here is treated as a failure.
          pytest -m integration -q -rs | tee integration.log
          ! grep -q "SKIPPED" integration.log
