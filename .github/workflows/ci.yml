name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy src

      # The integration tests need Postgres with PostGIS, pgvector and pg_trgm. The
      # project's own database image provides exactly that, so CI uses it too.
      - name: Start the database
        working-directory: .
        run: |
          docker compose up -d --wait db

      - name: Tests (unit and integration)
        # bash, not the default sh: this step pipes pytest, and only bash here sets
        # pipefail, without which a failing run would be masked by tee's exit code.
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://dealsignal:dealsignal@localhost:5433/dealsignal_test
        run: |
          pytest --cov=dealsignal --cov-report=term-missing -rs | tee test.log
          # Integration tests skip themselves when Postgres is unreachable, which in CI
          # would hide a broken setup rather than report one.
          ! grep -q "SKIPPED" test.log
